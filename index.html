<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBS Observation — ระบบสังเกตพฤติกรรมความปลอดภัย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (compat SDK: works on GitHub Pages with no build step) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- Your Firebase project settings + admin list live in this file -->
<script src="firebase-config.js"></script>
<!-- Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --font-head: "Barlow Semi Condensed", "Segoe UI", Tahoma, sans-serif;
    --font-body: "Inter", "Segoe UI", Tahoma, sans-serif;

    --ink: #16212F;
    --ink-soft: #3E4A58;
    --steel: #667080;
    --paper: #F1F2ED;
    --surface: #FFFFFF;
    --surface-2: #F7F7F4;
    --line: #DBDCD3;
    --line-strong: #C3C5B9;

    --amber: #E9A23B;
    --amber-ink: #7A4B04;
    --amber-bg: #FCF0DA;

    --green: #2E7D52;
    --green-bg: #E3F2E9;

    --red: #C1402A;
    --red-bg: #FBE6E1;

    --blue: #2E6C8E;
    --blue-bg: #E6EFF4;

    --grey-bg: #ECEDE8;

    --radius-s: 4px;
    --radius-m: 8px;

    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #ECEEF0; --ink-soft: #C7CCD3; --steel: #96A0AC;
      --paper: #14181D; --surface: #1B2027; --surface-2: #20262E;
      --line: #2C333C; --line-strong: #3A4249;
      --amber-bg: #3A2C10; --amber-ink: #F2C87B;
      --green-bg: #16301F; --red-bg: #3A1912; --blue-bg: #17252E;
      --grey-bg: #232A32;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECEEF0; --ink-soft: #C7CCD3; --steel: #96A0AC;
    --paper: #14181D; --surface: #1B2027; --surface-2: #20262E;
    --line: #2C333C; --line-strong: #3A4249;
    --amber-bg: #3A2C10; --amber-ink: #F2C87B;
    --green-bg: #16301F; --red-bg: #3A1912; --blue-bg: #17252E;
    --grey-bg: #232A32;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  img { max-width: 100%; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  h1, h2, h3, .head { font-family: var(--font-head); font-weight: 600; letter-spacing: 0.01em; margin: 0; color: var(--ink); }

  /* ---------- Top bar ---------- */
  #topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 16px; background: var(--ink); color: #F5F1E6; }
  #topbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #topbar .brand .mark { width: 30px; height: 30px; border-radius: 6px; background: var(--amber); color: #2A1B02; display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 700; font-size: 15px; flex: none; }
  #topbar .brand .titles { min-width: 0; }
  #topbar .brand .titles .t1 { font-family: var(--font-head); font-weight: 600; font-size: 17px; line-height: 1.1; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .brand .titles .t2 { font-size: 11px; color: #B7BFC9; white-space: nowrap; }
  #hamburger { display: none; background: none; border: none; color: #F5F1E6; font-size: 20px; cursor: pointer; padding: 6px; }
  #userchip { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; color: inherit; flex: none; }
  #userchip .av { width: 26px; height: 26px; border-radius: 50%; background: var(--amber); color: #2A1B02; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; overflow: hidden; }
  #userchip .meta { text-align: left; line-height: 1.15; min-width: 0; }
  #userchip .meta .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; max-width: 140px; overflow:hidden; text-overflow: ellipsis; }
  #userchip .meta .dp { font-size: 11px; color: #B7BFC9; white-space: nowrap; max-width: 140px; overflow:hidden; text-overflow: ellipsis;}
  .adminbadge { display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.04em; background: var(--amber); color:#2A1B02; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:1px; }

  /* ---------- Shell layout ---------- */
  #shell { display: flex; min-height: calc(100% - 56px); }
  #nav { width: 220px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 10px; }
  #nav button.navitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 10px 12px; margin-bottom: 2px; border-radius: var(--radius-s); font-size: 14px; font-weight: 500; color: var(--ink-soft); cursor: pointer; }
  #nav button.navitem .ic { width: 18px; text-align: center; font-size: 15px; }
  #nav button.navitem:hover { background: var(--surface-2); }
  #nav button.navitem.active { background: var(--amber-bg); color: var(--amber-ink); font-weight: 600; }
  #nav .navdivider { height: 1px; background: var(--line); margin: 10px 4px; }
  #nav .navfoot { padding: 10px 12px; font-size: 11.5px; color: var(--steel); line-height:1.5; }
  @media (max-width: 860px) {
    #hamburger { display: inline-block; }
    #nav { position: fixed; top: 56px; bottom: 0; left: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 2px 0 12px rgba(0,0,0,0.15); overflow-y: auto; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
    #nav.open { transform: translateX(0); }
    #navscrim.open { display: block; position: fixed; inset: 56px 0 0 0; z-index: 45; background: rgba(0,0,0,0.35); }
    main#content { padding: 14px; }
    #userchip .meta { display: none; }
  }
  #navscrim { display: none; }
  main#content { flex: 1; min-width: 0; padding: 20px; padding-bottom: 60px; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* ---------- Generic bits ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-s); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #F5F1E6; }
  .btn.primary:hover { background: #232F3D; }
  .btn.amber { background: var(--amber); border-color: var(--amber); color: #2A1B02; }
  .btn.amber:hover { filter: brightness(1.04); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.danger { color: var(--red); border-color: var(--red-bg); }
  .btn.small { padding: 6px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }

  label.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--steel); margin-bottom: 4px; }
  input[type=text], input[type=date], input[type=number], input[type=password], input[type=email], select, textarea {
    width: 100%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    border-radius: var(--radius-s); padding: 8px 10px;
  }
  textarea { resize: vertical; min-height: 46px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .req { color: var(--red); margin-left: 3px; font-weight: 700; }
  .field-error, textarea.field-error { border-color: var(--red) !important; background: var(--red-bg); }
  .item-row.row-invalid { background: var(--red-bg); border-radius: var(--radius-s); }
  .icmt input.field-error { border-color: var(--red); background: var(--red-bg); }
  .validation-banner { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); border-radius: var(--radius-s); padding: 10px 12px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
  .validation-banner ul { margin: 6px 0 0; padding-left: 18px; font-weight: 400; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; }
  .section-title { font-family: var(--font-head); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--steel); margin: 26px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 600; }
  .pill.grey { background: var(--grey-bg); color: var(--steel); }
  .pill.amber { background: var(--amber-bg); color: var(--amber-ink); }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.blue { background: var(--blue-bg); color: var(--blue); }

  .empty { text-align: center; padding: 50px 20px; color: var(--steel); }
  .empty .big { font-size: 34px; margin-bottom: 6px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #F5F1E6; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 100; box-shadow: 0 6px 18px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ---------- Reminder bar ---------- */
  #reminderbar { display:flex; align-items:center; gap:10px; padding:9px 16px; font-size:13px; background: var(--red-bg); color: var(--red); flex-wrap:wrap; }
  #reminderbar.amberbar { background: var(--amber-bg); color: var(--amber-ink); }
  #reminderbar button.linklike { background:none; border:none; padding:0; color:inherit; font-weight:700; text-decoration:underline; cursor:pointer; font-size:13px; }
  #reminderbar .rbx { margin-left:auto; background:none; border:none; color:inherit; cursor:pointer; font-size:15px; padding:2px 4px; }

  /* ---------- Login / auth ---------- */
  #loginwrap { min-height: calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .logincard { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 28px 26px 24px; }
  .logincard .brandbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .logincard .brandbar .mark { width: 34px; height: 34px; border-radius: 7px; background: var(--amber); color: #2A1B02; display:flex; align-items:center; justify-content:center; font-family: var(--font-head); font-weight: 700; font-size: 17px; }
  .logincard h1 { font-size: 21px; margin-bottom: 2px; }
  .logincard .sub { font-size: 13px; color: var(--steel); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .adddept-row { display: flex; gap: 8px; margin-top: 8px; }
  .adddept-row input { flex: 1; }

  /* ---------- Guide / training page ---------- */
  .guidehero { background: var(--ink); color: #fff; border-radius: var(--radius-m); padding: 22px 20px; margin-bottom: 18px; }
  .guidehero h2 { color:#fff; margin:0 0 4px; }
  .guidehero p { margin:0; opacity:.8; font-size:13px; }
  .gtoc { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 0; }
  .gtoc a { background: rgba(255,255,255,.12); color:#fff; text-decoration:none; font-size:12px; padding:5px 10px; border-radius:999px; }
  .gtoc a:hover { background: var(--amber); color: var(--ink); }
  .gstep { display:flex; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; margin-bottom:12px; scroll-margin-top:70px; }
  .gnum { flex:none; width:34px; height:34px; border-radius:50%; background:var(--amber); color:var(--ink); font-family:var(--font-head); font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; }
  .gbody { flex:1; min-width:0; }
  .gbody h3 { margin:2px 0 2px; font-size:16px; }
  .gbody .en { color:var(--steel); font-size:12px; margin-bottom:8px; }
  .gbody ul, .gbody ol { margin:6px 0 0; padding-left:20px; font-size:13.5px; line-height:1.65; }
  .gtip { background:var(--blue-bg); color:var(--blue); border-radius:var(--radius-s); padding:8px 10px; font-size:12.5px; margin-top:10px; }
  .gwarn { background:var(--red-bg); color:var(--red); border-radius:var(--radius-s); padding:8px 10px; font-size:12.5px; margin-top:10px; }
  .gmock { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 2px; font-size:12.5px; }
  .gmock .tg { display:inline-flex; width:30px; height:30px; border-radius:6px; align-items:center; justify-content:center; font-weight:800; color:#fff; }
  .tg.s { background:var(--green); } .tg.u { background:var(--red); } .tg.b { background:var(--steel); }
  .gtable { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px; }
  .gtable th, .gtable td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  .gtable th { background:var(--surface-2); }
  .gfaq details { border:1px solid var(--line); border-radius:var(--radius-s); padding:10px 12px; margin-bottom:8px; background:var(--surface); }
  .gfaq summary { cursor:pointer; font-weight:600; font-size:13.5px; }
  .gfaq p { margin:8px 0 0; font-size:13px; color:var(--steel); line-height:1.6; }
  .guidewrap-solo { max-width:820px; margin:0 auto; padding:16px; }
  @media print { #topbar, #nav, .noprint { display:none !important; } .gstep { break-inside: avoid; } }
  .notice { font-size: 12px; color: var(--amber-ink); background: var(--amber-bg); border-radius: var(--radius-s); padding: 8px 10px; margin-bottom: 14px; }
  .authtabs { display:flex; border:1px solid var(--line-strong); border-radius: var(--radius-s); overflow:hidden; margin-bottom:18px; }
  .authtabs button { flex:1; border:none; background: var(--surface); color: var(--ink-soft); padding:9px; font-weight:600; font-size:13.5px; cursor:pointer; }
  .authtabs button.active { background: var(--ink); color:#F5F1E6; }
  .orline { display:flex; align-items:center; gap:10px; margin:14px 0; color: var(--steel); font-size:12px; }
  .orline::before, .orline::after { content:""; flex:1; height:1px; background: var(--line); }

  /* ---------- Dashboard ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar select { width: auto; }
  .toolbar .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-s); overflow: hidden; }
  .seg button { border: none; background: var(--surface); color: var(--ink-soft); padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; border-right: 1px solid var(--line-strong); }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--ink); color: #F5F1E6; }

  .obslist { display: flex; flex-direction: column; gap: 10px; }
  .obscard { display: flex; gap: 14px; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: var(--radius-s); padding: 12px 14px; }
  .obscard:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .obscard.status-open { border-left-color: var(--amber); }
  .obscard.status-closed { border-left-color: var(--green); }
  .obscard .main { flex: 1; min-width: 0; cursor:pointer; }
  .obscard .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom: 4px;}
  .obscard .title { font-weight: 700; font-size: 14.5px; }
  .obscard .meta { font-size: 12px; color: var(--steel); }
  .obscard .stats { display:flex; gap:12px; align-items:center; flex:none; }
  .obscard .stat { text-align:center; min-width: 38px; }
  .obscard .stat b { display:block; font-size: 16px; font-family: var(--font-head); }
  .obscard .stat span { font-size: 10px; color: var(--steel); }
  .obscard .cardactions { align-self:center; flex:none; display:flex; gap:6px; }

  /* ---------- Observation form ---------- */
  .formgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; }
  @media (max-width: 640px) { .formgrid { grid-template-columns: 1fr; } }
  .totalsbar { display: flex; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; }
  .totalsbar .tchip { flex: 1; min-width: 90px; text-align: center; border-radius: var(--radius-s); padding: 8px 6px; font-family: var(--font-head); }
  .totalsbar .tchip b { display:block; font-size: 22px; line-height:1; }
  .totalsbar .tchip span { font-size: 11px; }
  .totalsbar .tchip.safe { background: var(--green-bg); color: var(--green); }
  .totalsbar .tchip.unsafe { background: var(--red-bg); color: var(--red); }
  .totalsbar .tchip.na { background: var(--grey-bg); color: var(--steel); }
  .accordion-controls { display: flex; justify-content: flex-end; gap: 8px; margin: 16px 0 6px; }
  .category { border: 1px solid var(--line); border-radius: var(--radius-s); margin-bottom: 8px; overflow: hidden; }
  .category .cathead { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); cursor: pointer; user-select: none; }
  .category .cathead .chv { font-size: 11px; color: var(--steel); transition: transform .15s; flex: none; }
  .category.open .cathead .chv { transform: rotate(90deg); }
  .category .cathead .names { flex: 1; min-width:0; }
  .category .cathead .n1 { font-weight: 700; font-size: 13.5px; }
  .category .cathead .n2 { font-size: 11.5px; color: var(--steel); }
  .category .cathead .badges { display:flex; gap:6px; flex:none; }
  .category .catbody { display: none; padding: 4px 12px 10px; }
  .category.open .catbody { display: block; }
  .item-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .item-row:first-child { border-top: none; }
  .item-row .itxt { flex: 1 1 220px; min-width: 180px; font-size: 13px; }
  .item-row .itxt .en { font-weight: 500; }
  .item-row .itxt .th { color: var(--steel); font-size: 12px; }
  .item-row .itog { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-s); overflow: hidden; flex: none; }
  .item-row .itog button { border: none; background: var(--surface); padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; border-right: 1px solid var(--line-strong); color: var(--ink-soft); }
  .item-row .itog button:last-child { border-right: none; }
  .item-row .itog button.sel-S { background: var(--green); color: #fff; }
  .item-row .itog button.sel-U { background: var(--red); color: #fff; }
  .item-row .itog button.sel-NA { background: var(--steel); color: #fff; }
  .item-row .icmt { flex: 1 1 180px; min-width: 140px; }
  .item-row .icmt input { padding: 6px 8px; font-size: 12.5px; }

  .apn-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .apn-table th { text-align: left; font-size: 11px; color: var(--steel); font-weight: 600; padding: 4px 6px; }
  .apn-table td { padding: 5px 6px; vertical-align: top; }
  .apn-table tr + tr td { border-top: 1px solid var(--line); }
  .apn-table input, .apn-table select { font-size: 12.5px; padding: 6px 8px; }
  .apn-meta { font-size: 10.5px; color: var(--steel); margin-top: 3px; }
  .formfoot { position: sticky; bottom: 0; background: linear-gradient(to top, var(--paper) 70%, transparent); padding: 16px 0 4px; margin-top: 12px; display: flex; justify-content: flex-end; gap: 10px; }

  /* ---------- Tracker table ---------- */
  .tracktable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tracktable th { text-align: left; font-size: 11px; color: var(--steel); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px; border-bottom: 1px solid var(--line-strong); }
  .tracktable td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tracktable tr:hover td { background: var(--surface-2); }

  /* ---------- Reports ---------- */
  .kpirow { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0; }
  @media (max-width:640px) { .kpirow { grid-template-columns:repeat(2,1fr); } }
  .kpi { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m); padding:14px 16px; }
  .kpi .kv { font-family: var(--font-head); font-size: 26px; font-weight: 700; line-height: 1; }

const toastEl = document.getElementById("toast");
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove("show"), 2600); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
// "Other" department: the observer types the real department in a free-text box.
function isOtherDept(name) { return /^\s*(others?\b|อื่น)/i.test(String(name || "")) || /อื่น ?ๆ/.test(String(name || "")); }
function deptLabel(o) { if (!o) return ""; const d = o.department || ""; return (isOtherDept(d) && (o.departmentOther || "").trim()) ? d + ": " + o.departmentOther.trim() : d; }
function errClass(fieldId) { return (S.formErrors && S.formErrors.missingFields && S.formErrors.missingFields.has(fieldId)) ? " field-error" : ""; }

function fmtDate(iso) { if (!iso) return "-"; const d = new Date(iso + "T00:00:00"); if (isNaN(d)) return iso; return d.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" }); }
function fmtDateTime(iso) { if (!iso) return "-"; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString("th-TH", { day: "2-digit", month: "short" }) + " " + d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }); }

function isAdmin() {

const FB_CFG = window.FIREBASE_CONFIG || null;

let unsubObs = null, unsubDept = null, unsubArea = null;

async function initCapabilities() {
  if (FB_CONFIGURED) {
    try {
      firebase.initializeApp(FB_CFG);
      fbAuth = firebase.auth();
      fbDb = firebase.firestore();

  capabilitiesReady = true;
}

function fbErr(e) {
  const c = (e && e.code) || "";
  const map = {

    "auth/operation-not-allowed": "ยังไม่ได้เปิดวิธีล็อกอินนี้ใน Firebase Console",
    "permission-denied": "ไม่มีสิทธิ์ทำรายการนี้ (ตรวจสอบ Firestore Rules หรือสิทธิ์แอดมิน)",
  };
  return map[c] || (e && e.message) || String(e);
}

/* ---------- Departments: everyone reads, only admins write ---------- */
function subscribeDepartments() {
  if (!fbDb) return;
  if (unsubDept) unsubDept();
  unsubDept = fbDb.collection("departments").onSnapshot(
    snap => {
      S.departments = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) }))
        .sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, { numeric: true, sensitivity: "base" }));
      render();
    },
    err => console.warn("departments listener:", err)
  );
}

async function addDepartment(nameEn, nameTh) {
  nameEn = (nameEn || "").trim(); nameTh = (nameTh || "").trim();
  if (!nameEn && !nameTh) return;

/* ---------- Observations (signed-in users) ---------- */
function subscribeObservations() {
  if (!fbDb || !S.user) return;
  if (unsubObs) unsubObs();
  unsubObs = fbDb.collection("observations").orderBy("createdAt", "desc").limit(1000).onSnapshot(
    snap => { S.observations = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) })); render(); },
    err => { console.warn("observations listener:", err); toast("โหลดข้อมูลไม่สำเร็จ: " + fbErr(err)); }
  );
}

function computeTotals(checklist) {
  let safe = 0, unsafe = 0, na = 0;
  ITEMS.forEach(it => {
    const v = checklist && checklist[it.no];
    if (!v || !v.status) return;
    if (v.status === "S") safe++;
    else if (v.status === "U") unsafe++;
    else if (v.status === "NA" || v.status === "B") na++;
  });
  return { safe, unsafe, na };
}

function newObservationDraft() {
  const checklist = {};
  ITEMS.forEach(it => { checklist[it.no] = { status: "", comment: "" }; });
  return {
    id: null, date: todayISO(), time: nowTimeStr(),
    department: S.session ? S.session.department : "",
    area: "", taskObserved: "",
    observerName: S.session ? S.session.name : "",
    personObserved: "", obsType: "individual", numObserved: "",
    checklist, overallComments: "", coached: "", followUpDueDate: "",
    actionPlan: [], createdAt: null, createdByName: S.session ? S.session.name : "", updatedAt: null,
  };
}

async function saveObservation(obs) {
  const totals = computeTotals(obs.checklist);
  const now = new Date().toISOString();
  const isNew = !obs.id;
  const payload = { ...obs, totals, updatedAt: now, updatedBy: S.user.uid, updatedByName: S.session.name };
  const id = payload.id;
  delete payload.id;
  if (isNew) { payload.createdAt = now; payload.createdBy = S.user.uid; payload.createdByName = S.session.name; }
  const clean = JSON.parse(JSON.stringify(payload));
  try {
    if (isNew) {
      const ref = await fbDb.collection("observations").add(clean);
      toast("บันทึกการสังเกตแล้ว / Observation saved");
      return ref.id;
    }
    await fbDb.collection("observations").doc(id).set(clean, { merge: true });
    toast("บันทึกการเปลี่ยนแปลงแล้ว / Changes saved");
    return id;
  } catch (e) { toast("บันทึกไม่สำเร็จ: " + fbErr(e)); throw e; }
}

async function deleteObservation(obsId) {
  if (!isAdmin()) { toast("เฉพาะแอดมินเท่านั้นที่ลบรายการได้"); return false; }
  try { await fbDb.collection("observations").doc(obsId).delete(); toast("ลบรายการแล้ว / Observation deleted"); return true; }
  catch (e) { toast("ลบไม่สำเร็จ: " + fbErr(e)); return false; }
}
function confirmDeleteObs(obsId) {
  const o = S.observations.find(x => x.id === obsId);
  const label = o ? `${fmtDate(o.date)} • ${o.area || o.taskObserved || "-"} • ${o.observerName || "-"}` : obsId;
  if (!confirm(`ลบรายการนี้ถาวร?\n${label}\n\nการลบกู้คืนไม่ได้ / This cannot be undone.`)) return Promise.resolve(false);
  return deleteObservation(obsId);
}

async function updateActionItemInObs(obsId, actionId, patch) {
  const who = S.session ? S.session.name : "ไม่ทราบชื่อ";
  const stamp = new Date().toISOString();
  const ref = fbDb.collection("observations").doc(obsId);
  try {
    await fbDb.runTransaction(async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists) return;
      const ap = (snap.data().actionPlan || []).map(a => a.id === actionId
        ? { ...a, ...patch, updatedByName: who, updatedBy: S.user.uid, updatedAt: stamp } : a);
      tx.update(ref, { actionPlan: ap, updatedAt: stamp });
    });
  } catch (e) { toast("อัปเดตไม่สำเร็จ: " + fbErr(e)); }
}

/* ---------- Auth / profile ---------- */
async function loadProfile(user) {
  try { const snap = await fbDb.collection("users").doc(user.uid).get(); return snap.exists ? snap.data() : null; }
  catch (e) { console.warn("profile load", e); return null; }
}
async function saveProfile(name, department) {
  const u = S.user;
  const data = { name, department, email: u.email || "", updatedAt: new Date().toISOString() };
  await fbDb.collection("users").doc(u.uid).set(data, { merge: true });
  S.session = { name, department, uid: u.uid, email: u.email || "" };
}
function startAuthListener() {
  if (!fbAuth) { S.authReady = true; render(); return; }
  fbAuth.onAuthStateChanged(async user => {
    if (unsubObs) { unsubObs(); unsubObs = null; }
    S.user = user || null;
    S.observations = [];
    if (!user) { S.session = null; S.view = "login"; S.authReady = true; render(); return; }
    // Re-open the department/area lists now that the user is signed in.
    // (A listener started while signed out is refused by Firestore rules and
    // never retries, which left new users with an empty department list.)
    subscribeDepartments(); subscribeAreas();
    const prof = await loadProfile(user);
    if (prof && prof.name && prof.department) {
      S.session = { name: prof.name, department: prof.department, uid: user.uid, email: user.email || "" };
      if (S.view === "login" || S.view === "profile" || S.view === "loading" || S.view === "guide") S.view = "dashboard";
    } else {
      S.session = null; S.view = "profile";
    }
    S.authReady = true;
    subscribeObservations();
    render();
  });
}

function initials(name) { name = (name || "").trim(); if (!name) return "?"; return (name.split(/\s+/)[0][0] || "").toUpperCase(); }

function getReminderCounts() {
  const today = todayISO();
  const soon = new Date(); soon.setDate(soon.getDate() + 3);
  const soonISO = soon.toISOString().slice(0, 10);
  let overdue = 0, dueSoon = 0;
  S.observations.forEach(o => (o.actionPlan || []).forEach(a => {
    if (a.status === "done" || !a.dueDate) return;
    if (a.dueDate < today) overdue++; else if (a.dueDate <= soonISO) dueSoon++;
  }));
  return { overdue, dueSoon };
}

function renderReminderBar() {

    if (!name) { toast("กรุณากรอกชื่อ"); return; }
    if (!dept || dept === "__add__") { toast("กรุณาเลือกแผนก"); return; }
    try { await saveProfile(name, dept); S.pendingName = null; S.view = "dashboard"; render(); }
    catch (e) { toast("บันทึกไม่สำเร็จ: " + fbErr(e)); }
  };
}

function validateForm(obs) {
  const missingFields = new Set();
  const reqFields = ["f_date", "f_time", "f_dept", "f_dept_other", "f_area", "f_task", "f_observer", "f_comments"];
  reqFields.forEach(id => {
    const el = document.getElementById(id);
    if (el && !(el.value || "").trim()) missingFields.add(id);
  });

  const missingComments = new Set();
  ITEMS.forEach(it => {
    const v = obs.checklist[it.no];
    if (v && (v.status === "U" || v.status === "B" || v.status === "NA") && !(v.comment || "").trim()) {
      missingComments.add(it.no);
    }
  });

  const hasUnsafeOrBarrier = Object.values(obs.checklist).some(v => v && (v.status === "U" || v.status === "B" || v.status === "NA"));
  const needsAction = hasUnsafeOrBarrier && !(obs.actionPlan || []).some(a => (a.action || "").trim());

  if (!missingFields.size && !missingComments.size && !needsAction) return null;
  return { missingFields, missingComments, needsAction };
}

function wireActionRows(obs) {
  document.querySelectorAll("#apBody tr").forEach(tr => {
    const id = tr.dataset.ap;
    tr.querySelectorAll("[data-apf]").forEach(el => {
      const field = el.dataset.apf;
      const handler = () => {
        const item = (obs.actionPlan || []).find(a => a.id === id);
        if (item) { item[field] = el.value; item.updatedByName = S.session ? S.session.name : item.updatedByName; item.updatedAt = new Date().toISOString(); }
      };
      el.addEventListener("input", handler); el.addEventListener("change", handler);
    });
  });
  document.querySelectorAll("[data-apdel]").forEach(btn => btn.onclick = () => {
    obs.actionPlan = (obs.actionPlan || []).filter(a => a.id !== btn.dataset.apdel);
    render();
  });

  document.getElementById("saveForm").onclick = async () => {
    const errs = validateForm(obs);
    if (errs) {
      S.formErrors = errs;
      // Expand categories containing items that need a comment, so the user can see them.
      ITEMS.forEach(it => { if (errs.missingComments.has(it.no)) S.openCats.add(it.catIndex); });
      render();
      const parts = [];
      if (errs.missingFields.size) parts.push("กรอกข้อมูลทั่วไป/ความเห็นเพิ่มเติมให้ครบ");
      if (errs.missingComments.size) parts.push("ใส่หมายเหตุให้ข้อที่ Unsafe/Barrier");
      if (errs.needsAction) parts.push("เพิ่มมาตรการแก้ไขอย่างน้อย 1 รายการ");
      toast("กรุณา: " + parts.join(" / "));
      const banner = document.querySelector(".validation-banner");
      if (banner) banner.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    S.formErrors = null;
    const btn = document.getElementById("saveForm");
    btn.disabled = true; btn.textContent = "กำลังบันทึก…";
    try {
      await saveObservation(obs);
      S.editingObs = null;
      goto("dashboard");
    } catch (e) { btn.disabled = false; btn.textContent = "บันทึก / Save"; }
  };
}

/* ============================================================
   RENDER: ACTION TRACKER
   ============================================================ */
function actionStatusOf(a) {
  const today = todayISO();
  if (a.status === "done") return "done";
  if (a.dueDate && a.dueDate < today) return "overdue";
  return a.status === "in_progress" ? "in_progress" : "open";
}

function monthLabelTh(ym) {
  if (!ym) return "";
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
}

function computeReportData() {
  let scope = S.observations.slice();
  if (!S.reportsAllTime) scope = scope.filter(o => (o.date || "").slice(0, 7) === S.reportsMonth);
  if (S.reportsDept) scope = scope.filter(o => o.department === S.reportsDept);
  if (S.reportsArea) scope = scope.filter(o => (o.area || "(ไม่ระบุพื้นที่)") === S.reportsArea);

  let totSafe = 0, totUnsafe = 0, totBarrier = 0;
  const itemUnsafeCount = {};
  scope.forEach(o => {
    const t = o.totals || computeTotals(o.checklist);
    totSafe += t.safe; totUnsafe += t.unsafe; totBarrier += t.na;
    ITEMS.forEach(it => {
      const v = o.checklist && o.checklist[it.no];
      if (v && v.status === "U") itemUnsafeCount[it.no] = (itemUnsafeCount[it.no] || 0) + 1;
    });
  });

  const deptCount = {};
  scope.forEach(o => { const d = o.department || "(ไม่ระบุแผนก)"; deptCount[d] = (deptCount[d] || 0) + 1; });
  const deptLabels = Object.keys(deptCount).sort((a, b) => deptCount[b] - deptCount[a]);
  const deptData = deptLabels.map(d => deptCount[d]);

  const submitterCount = {};
  scope.forEach(o => {
    const nm = o.observerName || "(ไม่ระบุชื่อ)";
    if (!submitterCount[nm]) submitterCount[nm] = { count: 0, dept: o.department || "" };
    submitterCount[nm].count++;
  });
  const submitters = Object.keys(submitterCount)
    .map(nm => ({ name: nm, count: submitterCount[nm].count, dept: submitterCount[nm].dept }))
    .sort((a, b) => b.count - a.count);

  const areaSet = new Set();
  S.observations.forEach(o => { if (!S.reportsDept || o.department === S.reportsDept) areaSet.add(o.area || "(ไม่ระบุพื้นที่)"); });
  if (!S.reportsDept) S.areas.forEach(a => areaSet.add(a.name)); // show admin-configured areas even with 0 observations yet

  return { scope, totSafe, totUnsafe, totBarrier, itemUnsafeCount, deptLabels, deptData, submitters, areaList: Array.from(areaSet).sort() };
}

function donutHtml(safe, unsafe, barrier) {
  const total = safe + unsafe + barrier;
  if (!total) return '<div class="empty" style="padding:30px 10px;"><div class="big">&#128202;</div><div style="font-size:12.5px;">ยังไม่มีข้อมูลในช่วงที่เลือก</div></div>';
  const p1 = safe / total * 100, p2 = p1 + unsafe / total * 100;
  const pct = v => (v / total * 100).toFixed(1) + "%";
  return `
    <div class="donutbox">
      <div class="donut" style="background:conic-gradient(var(--green) 0 ${p1}%, var(--red) ${p1}% ${p2}%, var(--steel) ${p2}% 100%);">
        <div class="donut-hole"><b>${total}</b><span>ข้อที่ตรวจ</span></div>
      </div>
      <div class="legend">
        <div><i style="background:var(--green)"></i>Safe <b>${safe}</b> <em>${pct(safe)}</em></div>
        <div><i style="background:var(--red)"></i>Unsafe <b>${unsafe}</b> <em>${pct(unsafe)}</em></div>
        <div><i style="background:var(--steel)"></i>Barriers (B) <b>${barrier}</b> <em>${pct(barrier)}</em></div>
      </div>
    </div>`;
}
function vbarsHtml(labels, values, color) {
  if (!labels.length) return '<div class="empty" style="padding:30px 10px;"><div class="big">&#128202;</div><div style="font-size:12.5px;">ไม่มีข้อมูลในช่วงที่เลือก</div></div>';
  const max = Math.max(...values, 1), plot = 170;
  return `<div class="vbars">${labels.map((l, i) => `
    <div class="vbar">
      <div class="vplot"><div class="vval">${values[i]}</div><div class="vcol" style="height:${Math.max(3, Math.round(values[i] / max * plot))}px;background:${color};"></div></div>
      <div class="vlab" title="${esc(l)}">${esc(l)}</div>
    </div>`).join("")}</div>`;
}
function hbarsHtml(rowsData) {
  if (!rowsData.length) return '<div class="empty" style="padding:20px;"><div class="big">&#9989;</div><div>ไม่พบข้อมูล Unsafe ในช่วงที่เลือก</div></div>';
  const max = Math.max(...rowsData.map(r => r.value), 1);
  return `<div class="hbars">${rowsData.map(r => `
    <div class="hrow">
      <div class="hlab"><span>${esc(r.label)}</span><small>${esc(r.sub || "")}</small></div>
      <div class="htrack"><div class="hfill" style="width:${Math.max(2, r.value / max * 100)}%;"></div></div>
      <div class="hval">${r.value}</div>
    </div>`).join("")}</div>`;
}

async function exportToExcel() {
  if (!window.XLSX) { toast("ไม่สามารถโหลดไลบรารี Excel ได้"); return; }
  const btn = document.getElementById("exportXlsx");
  if (btn) { btn.disabled = true; btn.textContent = "กำลังสร้างไฟล์…"; }
  try {
    const rd = computeReportData();

    const months = [];
    { const base = new Date(); base.setDate(1);
      for (let i = 11; i >= 0; i--) { const dd = new Date(base.getFullYear(), base.getMonth() - i, 1); months.push(dd.toISOString().slice(0, 7)); } }
    const deptSet = new Set(S.observations.map(o => o.department || "(ไม่ระบุ)"));
    S.departments.forEach(d => deptSet.add(d.name));
    const depts = Array.from(deptSet);
    const summaryAoA = [["แผนก / Department", ...months.map(monthLabelTh), "รวม / Total"]];
    depts.forEach(dep => {
      const row = [dep];
      let total = 0;
      months.forEach(m => { const c = S.observations.filter(o => (o.department || "(ไม่ระบุ)") === dep && (o.date || "").slice(0, 7) === m).length; row.push(c); total += c; });
      row.push(total);
      summaryAoA.push(row);
    });

    const rankAoA = [["อันดับ", "รหัสข้อ", "หัวข้อ (EN)", "หัวข้อ (TH)", "หมวดหมู่", "จำนวนครั้งที่ Unsafe"]];
    Object.keys(rd.itemUnsafeCount).map(no => ({ no: Number(no), count: rd.itemUnsafeCount[no] }))
      .sort((a, b) => b.count - a.count)
      .forEach((r, i) => { const it = ITEMS.find(x => x.no === r.no); rankAoA.push([i + 1, it.no, it.en, it.th, CATS[it.catIndex][0], r.count]); });

    const obsAoA = [["ID", "วันที่", "แผนก", "พื้นที่", "งานที่สังเกต", "ผู้สังเกต", "ผู้ถูกสังเกต", "ประเภท", "Safe", "Unsafe", "Barriers (B)", "Coached", "Follow-up Due", "ความเห็น", "แผนกที่ระบุ (Other)"]];
    S.observations.forEach(o => {
      const t = o.totals || computeTotals(o.checklist);
      obsAoA.push([o.id || "", o.date || "", o.department || "", o.area || "", o.taskObserved || "", o.observerName || "", o.personObserved || "", o.obsType || "", t.safe, t.unsafe, t.na, o.coached || "", o.followUpDueDate || "", o.overallComments || "", o.departmentOther || ""]);
    });

    const detailAoA = [["Observation ID", "วันที่", "แผนก", "พื้นที่", "ข้อที่", "หัวข้อ (EN)", "หัวข้อ (TH)", "สถานะ", "หมายเหตุ", "แผนกที่ระบุ (Other)"]];
    S.observations.forEach(o => {
      ITEMS.forEach(it => {
        const v = o.checklist && o.checklist[it.no];
        if (v && v.status) {
          const st = v.status === "B" ? "B (Barrier)" : v.status === "NA" ? "B (Barrier)" : v.status;
          detailAoA.push([o.id || "", o.date || "", o.department || "", o.area || "", it.no, it.en, it.th, st, v.comment || "", o.departmentOther || ""]);
        }
      });
    });

    const apAoA = [["Observation ID", "วันที่", "แผนก", "พื้นที่", "มาตรการแก้ไข", "ผู้รับผิดชอบ", "วันครบกำหนด", "สถานะ", "แก้ไขล่าสุดโดย", "แก้ไขล่าสุดเมื่อ"]];
    S.observations.forEach(o => (o.actionPlan || []).forEach(a => {
      apAoA.push([o.id || "", o.date || "", o.department || "", o.area || "", a.action || "", a.responsible || "", a.dueDate || "", a.status || "", a.updatedByName || "", a.updatedAt || ""]);
    }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryAoA), "สรุปแผนกxเดือน");

    const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([wbout], { type: "application/octet-stream" });
    const filename = "BBS_Report_" + todayISO() + ".xlsx";

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("ดาวน์โหลดไฟล์แล้ว / Downloaded");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "⬇ Export Excel"; }
  }
}

   RENDER: DEPARTMENTS
   ============================================================ */
function renderDepartments() {
  const admin = isAdmin();
  const rows = S.departments.map(d => {
    const count = S.observations.filter(o => o.department === d.name).length;
    return `
      <div class="deptrow" data-drow="${esc(d.id)}">
        <div class="dinfo"><span class="nm">${esc(d.name)}</span>${d.nameTh ? `<span class="nmth">${esc(d.nameTh)}</span>` : ``}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="pill grey">${count} รายการ</span>
          ${admin ? `
            <div class="dactions">
              <button class="btn small ghost" data-drename="${esc(d.id)}">แก้ไข</button>
              <button class="btn small danger" data-ddelete="${esc(d.id)}">ลบ</button>
            </div>` : ``}
        </div>
      </div>`;
  }).join("");

  const areaRows = S.areas.map(a => {
    const count = S.observations.filter(o => o.area === a.name).length;
    return `
      <div class="deptrow" data-arow="${esc(a.id)}">
        <div class="dinfo"><span class="nm">${esc(a.name)}</span>${a.nameTh ? `<span class="nmth">${esc(a.nameTh)}</span>` : ``}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="pill grey">${count} รายการ</span>
          ${admin ? `
            <div class="dactions">
              <button class="btn small ghost" data-arename="${esc(a.id)}">แก้ไข</button>
              <button class="btn small danger" data-adelete="${esc(a.id)}">ลบ</button>
            </div>` : ``}
        </div>
      </div>`;
  }).join("");

  renderShell(`
    <h2 style="margin-bottom:4px;">แผนก & พื้นที่ / Departments &amp; Areas</h2>
    <div style="color:var(--steel);font-size:13px;margin-bottom:16px;">
      ${admin ? "จัดการรายชื่อแผนกและพื้นที่ที่ใช้ในระบบ (คุณเป็นแอดมิน)" : "รายชื่อแผนกและพื้นที่นี้กำหนดโดยผู้ดูแลระบบ หากต้องการเพิ่ม/แก้ไข กรุณาติดต่อแอดมิน"}
    </div>

    <div class="section-title" style="margin-top:0;">แผนก / Departments</div>
    ${admin ? `
    <div class="card">
      <div class="formgrid">
        <div><label class="field-label">ชื่อแผนก (EN)</label><input type="text" id="d_en" placeholder="e.g. Maintenance"></div>
        <div><label class="field-label">ชื่อแผนก (TH)</label><input type="text" id="d_th" placeholder="เช่น ซ่อมบำรุง"></div>
      </div>
      <button class="btn amber" id="d_add" style="margin-top:12px;">+ เพิ่มแผนก / Add department</button>
    </div>` : `<div class="notice">👁️ คุณกำลังดูในโหมดอ่านอย่างเดียว — เฉพาะแอดมินเท่านั้นที่เพิ่ม/แก้ไข/ลบแผนกได้</div>`}

    <div class="deptlist">${rows || `<div class="empty"><div class="big">&#127970;</div><div>${admin ? "ยังไม่มีแผนก เพิ่มแผนกแรกของคุณด้านบน" : "ยังไม่มีแผนกในระบบ กรุณาติดต่อแอดมิน"}</div></div>`}</div>

    <div class="section-title">พื้นที่ที่พบ / Areas</div>
    ${admin ? `
    <div class="card">
      <div class="formgrid">
        <div><label class="field-label">ชื่อพื้นที่ (EN)</label><input type="text" id="a_en" placeholder="e.g. Warehouse A"></div>
        <div><label class="field-label">ชื่อพื้นที่ (TH)</label><input type="text" id="a_th" placeholder="เช่น คลังสินค้า A"></div>
      </div>
      <button class="btn amber" id="a_add" style="margin-top:12px;">+ เพิ่มพื้นที่ / Add area</button>
    </div>` : `<div class="notice">👁️ คุณกำลังดูในโหมดอ่านอย่างเดียว — เฉพาะแอดมินเท่านั้นที่เพิ่ม/แก้ไข/ลบพื้นที่ได้</div>`}

    <div class="deptlist">${areaRows || `<div class="empty"><div class="big">&#128205;</div><div>${admin ? "ยังไม่มีพื้นที่ เพิ่มพื้นที่แรกของคุณด้านบน" : "ยังไม่มีพื้นที่ในระบบ กรุณาติดต่อแอดมิน"}</div></div>`}</div>

    <div class="card" style="margin-top:20px;">
      <div style="font-weight:600;margin-bottom:6px;font-size:13.5px;">บัญชีของฉัน / My account</div>
      <div style="font-size:13px;color:var(--steel);">${esc(S.session ? S.session.name : "")} • ${esc(S.session ? S.session.department : "")}${admin ? ' <span class="adminbadge">ADMIN</span>' : ""}</div>
      <button class="btn small" id="switchDeptBtn" style="margin-top:10px;">เปลี่ยนแผนกของฉัน / Change my department</button>
    </div>
  `);

  if (admin) {
    document.getElementById("d_add").onclick = async () => {
      const en = document.getElementById("d_en").value;
      const th = document.getElementById("d_th").value;
      if (!en.trim() && !th.trim()) { toast("กรุณากรอกชื่อแผนก"); return; }
      await addDepartment(en, th);
      document.getElementById("d_en").value = ""; document.getElementById("d_th").value = "";
    };
    document.querySelectorAll("[data-drename]").forEach(btn => btn.onclick = () => {
      const row = document.querySelector(`[data-drow="${btn.dataset.drename}"]`);
      const dep = S.departments.find(d => d.id === btn.dataset.drename);
      if (!row || !dep) return;
      row.querySelector(".dinfo").innerHTML = `
        <input type="text" class="renameinput" id="ren_en_${dep.id}" value="${esc(dep.name)}" style="width:110px;display:inline-block;">
        <input type="text" class="renameinput" id="ren_th_${dep.id}" value="${esc(dep.nameTh || "")}" style="width:110px;display:inline-block;margin-left:4px;">
        <button class="btn small amber" id="ren_ok_${dep.id}" style="margin-left:4px;">บันทึก</button>
        <button class="btn small ghost" id="ren_cancel_${dep.id}">ยกเลิก</button>`;
      document.getElementById(`ren_ok_${dep.id}`).onclick = async () => {
        const en = document.getElementById(`ren_en_${dep.id}`).value;
        const th = document.getElementById(`ren_th_${dep.id}`).value;
        await renameDepartment(dep.id, en, th);
      };
      document.getElementById(`ren_cancel_${dep.id}`).onclick = () => render();
    });
    document.querySelectorAll("[data-ddelete]").forEach(btn => btn.onclick = async () => {
      const dep = S.departments.find(d => d.id === btn.dataset.ddelete);
      if (!dep) return;
      if (!confirm(`ลบแผนก "${dep.name}" ใช่หรือไม่?`)) return;
      await deleteDepartment(dep.id);
    });

    document.getElementById("a_add").onclick = async () => {
      const en = document.getElementById("a_en").value;
      const th = document.getElementById("a_th").value;
      if (!en.trim() && !th.trim()) { toast("กรุณากรอกชื่อพื้นที่"); return; }
      await addArea(en, th);
      document.getElementById("a_en").value = ""; document.getElementById("a_th").value = "";
    };
    document.querySelectorAll("[data-arename]").forEach(btn => btn.onclick = () => {
      const row = document.querySelector(`[data-arow="${btn.dataset.arename}"]`);
      const ar = S.areas.find(a => a.id === btn.dataset.arename);
      if (!row || !ar) return;
      row.querySelector(".dinfo").innerHTML = `
        <input type="text" class="renameinput" id="aren_en_${ar.id}" value="${esc(ar.name)}" style="width:110px;display:inline-block;">
        <input type="text" class="renameinput" id="aren_th_${ar.id}" value="${esc(ar.nameTh || "")}" style="width:110px;display:inline-block;margin-left:4px;">
        <button class="btn small amber" id="aren_ok_${ar.id}" style="margin-left:4px;">บันทึก</button>
        <button class="btn small ghost" id="aren_cancel_${ar.id}">ยกเลิก</button>`;
      document.getElementById(`aren_ok_${ar.id}`).onclick = async () => {
        const en = document.getElementById(`aren_en_${ar.id}`).value;
        const th = document.getElementById(`aren_th_${ar.id}`).value;
        await renameArea(ar.id, en, th);
      };
      document.getElementById(`aren_cancel_${ar.id}`).onclick = () => render();
    });
    document.querySelectorAll("[data-adelete]").forEach(btn => btn.onclick = async () => {
      const ar = S.areas.find(a => a.id === btn.dataset.adelete);
      if (!ar) return;
      if (!confirm(`ลบพื้นที่ "${ar.name}" ใช่หรือไม่?`)) return;
      await deleteArea(ar.id);
    });
  }

  document.getElementById("switchDeptBtn").onclick = () => { S.view = "profile"; render(); };
}

function renderGuide() {
  if (!S.user) {
    root.innerHTML = `<div class="guidewrap-solo">
      <button class="backlink noprint" id="g_back">&larr; กลับหน้าเข้าสู่ระบบ</button>${guideBodyHtml()}</div>`;
    document.getElementById("g_back").onclick = () => { S.view = "login"; render(); };
  } else {
    renderShell(guideBodyHtml());
  }
  document.querySelectorAll(".gtoc a").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = document.querySelector(a.getAttribute("href"));
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

/* ============================================================
   MAIN RENDER DISPATCH
   ============================================================ */
function render() {
  if (!capabilitiesReady) return;
  if (!FB_CONFIGURED || !fbAuth) { renderSetupNotice(); return; }
  if (!S.authReady) { root.innerHTML = '<div id="loading-screen"><div class="spinner"></div><div>กำลังโหลด… / Loading…</div></div>'; return; }
  if (S.view === "guide" && (!S.user || S.session)) { renderGuide(); return; }
  if (!S.user) { renderLogin(); return; }
  if (S.view === "profile" || !S.session) { renderProfile(); return; }
  if (S.view === "form") { renderForm(); return; }
  if (S.view === "tracker") { renderTracker(); return; }
  if (S.view === "reports") { renderReports(); return; }
  if (S.view === "departments") { renderDepartments(); return; }
  renderDashboard();
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  await initCapabilities();
  if (fbAuth) { startAuthListener(); }
  render();
})();

// Expose a few things for the language toggle script below.
window.__bbs = { CATS, ITEMS, render };
})();
</script>

  function trNode(n) {
    if (LANG !== "en" || !n) return;
    if (n.nodeType === 3) {
      const p = n.parentNode;
      if (p && !SKIP[p.nodeName] && !(p.closest && p.closest("[data-noi18n]"))) {
        const v = trText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v;
      }
      return;
    }
    if (n.nodeType !== 1 || SKIP[n.nodeName] || n.closest("[data-noi18n]")) return;
    trAttrs(n);
    n.querySelectorAll("[placeholder],[title],[aria-label]").forEach(trAttrs);
    const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT);
    const list = []; while (w.nextNode()) list.push(w.currentNode);
    list.forEach(trNode);
  }

  // Wrap dialogs so confirm/alert messages follow the language too.
  const _confirm = window.confirm.bind(window), _alert = window.alert.bind(window);
  window.confirm = m => _confirm(trMsg(m));
  window.alert = m => _alert(trMsg(m));

  // Toggle button
  const css = document.createElement("style");
  css.textContent = `
    #langToggle{display:inline-flex;border:1px solid rgba(245,241,230,.35);border-radius:999px;overflow:hidden;font:600 12px/1 system-ui,sans-serif;flex:none}
    #langToggle button{background:transparent;color:inherit;border:0;padding:6px 10px;cursor:pointer;opacity:.7}
    #langToggle button.on{background:#F5F1E6;color:#1d2b26;opacity:1}
    #langToggle.floating{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:120;background:#1d2b26;color:#F5F1E6;box-shadow:0 4px 12px rgba(0,0,0,.2)}
    html[data-lang="en"] .itxt .th, html[data-lang="en"] .names .n2 { display:none; }
  `;
  document.head.appendChild(css);
  const tg = document.createElement("div");
  tg.id = "langToggle"; tg.setAttribute("data-noi18n", "");
  tg.innerHTML = '<button type="button" data-l="th">TH</button><button type="button" data-l="en">EN</button>';
  function paintToggle() { tg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG)); }
  function placeToggle() {
    const bar = document.getElementById("topbar");
    if (bar) {
      if (tg.parentNode !== bar || tg.classList.contains("floating")) {
        tg.classList.remove("floating");
        const chip = document.getElementById("userchip");
        if (chip && chip.parentNode) chip.parentNode.insertBefore(tg, chip); else bar.appendChild(tg);
      }
    } else if (tg.parentNode !== document.body || !tg.classList.contains("floating")) {
      tg.classList.add("floating"); document.body.appendChild(tg);
    }
  }
  tg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.l === LANG) return;
    LANG = b.dataset.l;
    try { localStorage.setItem("bbs_lang", LANG); } catch (err) {}
    document.documentElement.lang = LANG; document.documentElement.dataset.lang = LANG;
    paintToggle();
    if (window.__bbs && window.__bbs.render) window.__bbs.render(); // rebuilds the page in Thai; EN is applied by the observer
    trNode(document.body); placeToggle();
  });

  let busy = false;
  const obs = new MutationObserver(ms => {
    if (busy) return; busy = true;
    try {
      if (LANG === "en") ms.forEach(m => {
        if (m.type === "characterData") trNode(m.target);
        else m.addedNodes.forEach(trNode);
      });
      placeToggle();
    } finally { busy = false; }
  });
  function start() {
    document.documentElement.lang = LANG; document.documentElement.dataset.lang = LANG;
    paintToggle(); placeToggle(); trNode(document.body);
    obs.observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</body>
